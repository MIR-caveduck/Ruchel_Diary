<template id="t0924"><div class="date">2026 · 09 · 24</div><h3>증명의 날</h3><div class="subtitle">오늘의 목표 : GOLD III 🍓</div><div class="body"><div class="mission"><small>TODAY'S MISSION</small><b>골드4 → 골드3</b>정해진 시간까지 승급 실패 시 다음 날 24시간 노방종 💀</div><p>처음에는 24시간 노방종도 아주 조금 기대했지만... <strong>진짜 열심히 하는 거 보고 있으니까 그냥 올라갔으면 좋겠더라 ㅋㅋㅋ</strong></p><p>좋은 팀원들을 만난 판도 있었지만 그것만으로 올라간 건 아니라고 생각해. 계속 게임하면서 자기 몫 해내고, 결국 마지막에는 진짜 골드3까지.</p><div class="photo"><img src="gold3-celebration.png"><div class="cap">증명의 날 · 결국 해냈네 루체리 🍓🏆</div></div><p><strong>증명의 날, 증명 완료.</strong><br>마지막에 진짜 올라가는 거 보니까 나도 괜히 기분 좋더라.</p><button class="rankbtn" id="rankbtn">승급 결과 확인 ✦</button><div class="rankpop" id="rankpop"><img src="gold3-badge.png"><b>GOLD III · 승급을 축하합니다! 🍓</b></div><p style="text-align:center;margin-top:30px">축하해 루체리.<br><br>...근데 24시간 노방종은 사라졌네?<br><strong>아쉽다는 뜻은 아닙니다. 진짜입니다. 💀ㅋㅋㅋㅋ</strong></p></div><div class="nav"><button disabled>← 이전 기록</button><button data-go="0925">09.25 다음 기록 →</button></div></template>
<template id="t0925"><div class="date">2026 · 09 · 25</div><h3>한복 그리고 절망전</h3><div class="subtitle">전날엔 골드3, 다음 날엔 한복 루체리 🍓</div><div class="body"><p>전날 그렇게 골드3 찍더니 다음 날은 추석이라고 <strong>한복 입고 등장 ㅋㅋㅋ</strong></p><div class="photo"><img src="hanbok.png"><div class="cap">09.25 · 한복 루체리 예쁘더라 🍓</div></div><p>그리고 절망전에도 뽑혔고.</p><p>원래도 원딜인 루체리한테 이제 <strong>절망전이라는 목표가 하나 더 생겼네.</strong> 한동안 원딜 루체리 많이 보게 되겠다 ㅋㅋㅋ</p><div class="photo"><img src="adc-practice.png"><div class="cap">절망전 준비 중 · 원딜 루체리 집중 모드 🎧🍓</div></div><p>잘 풀리는 날도 있고 꼬이는 날도 있겠지만 결과만 보는 것보다 그렇게 맞춰가고 연습하는 과정 보는 것도 나는 재밌으니까.</p><p><strong>열심히 해봐 루체리. 원딜 루체리 응원하고 있을게 🍓</strong></p><p style="text-align:center;margin-top:38px;color:#bca5ad">오늘도 루뱅알.<br>다음 기록에서 계속 📖</p></div><div class="nav"><button data-go="0924">← 09.24 이전 기록</button><button data-go="0927">09.27 다음 기록 →</button></div></template>

<template id="t0927"><div class="date">2026 · 09 · 27</div><h3>절망전</h3><div class="subtitle">드디어 절망전 당일 🎮🍓</div><div class="body"><div class="photo"><img src="despair-match-0927.png"><div class="cap">09.27 · 드디어 절망전 당일 🎮🍓</div></div><p>오늘은 드디어 <strong>절망전!</strong></p><p>총 4판 해서 앞에 두 판은 이기고,<br>3번째 판은 아쉽게 패배. 마지막 이벤트전(?)도 패배!</p><p>사실 방송은 계속 켜놓고 있었는데<br><strong>회사에서 보다가 피곤해서 중간중간 졸아버렸습니다 💀ㅋㅋㅋㅋ</strong><br>그래서 제대로 못 본 장면이 꽤 많음...</p><p>그래도 <strong>드롭스는 받았다.</strong><br>루체리 방송 보다가 이거 받은 거임 ㅋㅋㅋㅋㅋ 🍓</p><div class="photo"><img src="drops-0927.png"><div class="cap">09.27 · 졸면서도 드롭스는 야무지게 챙김 💀ㅋㅋㅋㅋ</div></div><p>절망전 끝난 게 거의 00시였는데<br>00시부터 바로 <strong>베이블루 회의</strong>까지 잡혀 있어서 그대로 방종.</p><p style="text-align:center;margin-top:38px"><strong>절망전까지 고생했다 루체리 🍓</strong><br><br>루뱅알~ ♥️</p></div><div class="nav"><button data-go="0925">← 09.25 이전 기록</button><button disabled>다음 기록 →</button></div></template>
<script>
const lock=document.getElementById('lock'),diary=document.getElementById('diary'),form=document.getElementById('form'),secret=document.getElementById('secret'),msg=document.getElementById('msg'),icon=document.getElementById('icon'),content=document.getElementById('content');
const bgm=document.getElementById('bgmAudio'),bgmBox=document.getElementById('bgmBox'),bgmToggle=document.getElementById('bgmToggle'),bgmVolume=document.getElementById('bgmVolume');bgm.volume=.18;bgmToggle.onclick=()=>{if(bgm.paused){bgm.play().then(()=>bgmToggle.textContent='❚❚ BGM').catch(()=>{});}else{bgm.pause();bgmToggle.textContent='▶ BGM';}};bgmVolume.oninput=()=>bgm.volume=Number(bgmVolume.value);

function rank(){let p=document.getElementById('rankpop');if(p.classList.contains('show'))return;p.classList.add('show');this.disabled=true;this.style.opacity=.4;let f=document.getElementById('fanfare'),sy=['✦','★','◆','🍓','♥'];for(let i=0;i<50;i++){let e=document.createElement('span');e.className='spark';e.textContent=sy[i%5];let a=Math.PI*2*i/50,d=100+Math.random()*300;e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');e.style.setProperty('--r',(Math.random()*500-250)+'deg');e.style.fontSize=(12+Math.random()*17)+'px';f.appendChild(e);setTimeout(()=>e.remove(),1500)}if(navigator.vibrate)navigator.vibrate([25,30,55]);setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'center'}),100)}
</script></body></html>
